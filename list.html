<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .card {
        background: #2a2a2a;
        width: 340px;
        border-radius: 16px;
        padding: 20px;
        color: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .discount-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
    }

    /* استایل دکمه‌ها با radio */
    .discount-option {
        position: relative;
        flex: 1;
        min-width: 70px;
    }

    .discount-option input[type="radio"] {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
    }

    .discount-label {
        display: block;
        padding: 12px 10px;
        text-align: center;
        background: #3a3a3a;
        border-radius: 10px;
        font-size: 15px;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    .discount-option input[type="radio"]:checked + .discount-label {
        background: #ffffff;
        color: #1e1e1e;
        font-weight: bold;
        border: 2px solid #4ade80;
        transform: scale(1.05);
    }

    .discount-label:hover {
        background: #444;
    }
</style>
<body>
    <ul>
        <li>tea</li>
        <li>coffee</li>
        <li>whisky</li>
    </ul>
    <br>
    <ol>
        <li>ali</li>
        <li>Nima</li>
        <li>mamd</li>
    </ol>
    <br>
    <dl>
        <dt>coffee</dt>
        <dd>warm drink</dd>
        <dt>cake</dt>
        <dd>warm cake</dd>
        <dt>soda</dt>
        <dd>cold drink</dd>
        <dt>whisky</dt>
        <dd>nice drink</dd>
        <dt>water</dt>
        <dd> drink</dd>
    </dl>

    <div class="card">
        <div class="discount-buttons">
            <label class="discount-option">
                <input type="radio" name="discount" value="20" checked>
                <span class="discount-label">20%</span>
            </label>

            <label class="discount-option">
                <input type="radio" name="discount" value="25">
                <span class="discount-label">25%</span>
            </label>

            <label class="discount-option">
                <input type="radio" name="discount" value="30">
                <span class="discount-label">30%</span>
            </label>

            <label class="discount-option">
                <input type="radio" name="discount" value="35">
                <span class="discount-label">35%</span>
            </label>

            <label class="discount-option">
                <input type="radio" name="discount" value="custom">
                <span class="discount-label">Custom</span>
            </label>
        </div>
    </div>
</body>
</html>
