<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dynamic Table Generator</h1>

        <div class="controls">
            <input type="number" id="rows" min="1" value="10" placeholder="تعداد ردیف‌ها">
            <input type="number" id="cols" min="1" value="12" placeholder="تعداد ستون‌ها">
            <button id="createBtn">Create Table</button>
        </div>

        <div id="tableWrap" class="table-wrap"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
